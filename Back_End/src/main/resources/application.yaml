spring:
  application:
    name: erpbackend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:erpbackend}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

app:
  jwt:
    # Dev-only default (256-bit+) - always override JWT_SECRET outside local dev.
    secret: ${JWT_SECRET:dev-only-insecure-jwt-signing-secret-change-me-in-production-0123456789}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:30d}

management:
  endpoints:
    web:
      exposure:
        include: health
